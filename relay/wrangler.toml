# The relay — a separate deployment from Quietkeep, and not part of it.
#
# Quietkeep works with this absent, unreachable or shut down forever. It exists
# for the Sync sibling, which trades away "no server" and therefore gets its own
# product, its own URL and its own first-run explanation (Doctrine §1).
#
# Nothing here is secret: there are no credentials, no account ids and no
# allowlist, because the relay holds sealed bytes it cannot read and its only
# credential is a 128-bit id derived from a key it has never seen.

name = "quietkeep-relay"
main = "worker.ts"
compatibility_date = "2026-07-01"

# A workers.dev URL, because this has no custom domain and the sync build has to
# name the host in its CSP. The URL the deploy prints is the value that goes into
# src/relay-host.ts — it is not guessable from here, and guessing it produces a
# build that passes every check and silently never syncs.
workers_dev = true

# Observability off on purpose. A request log would record the sync ids — which
# are stable per pairing — and that is a per-household activity trace, which is
# telemetry by another name and this project does not have telemetry.
[observability]
enabled = false

[[kv_namespaces]]
binding = "CHUNKS"
# Injected by .github/workflows/relay.yml, which finds or creates a namespace
# titled `quietkeep-relay-CHUNKS` and substitutes its id here before deploying.
# It stays a placeholder in the repo on purpose: the id is account-specific, and
# nothing about an account belongs in a public tree.
#
# THE CREDENTIAL NEEDS WORKERS PERMISSIONS, which the Pages deploy does not
# (V-18). A token holding only Cloudflare Pages:Edit fails here with wrangler's
# "Authentication error [code: 10000]", which names neither the permission nor
# the fix — so the workflow checks the KV endpoint directly first and says which
# two to add. Both are Account scope: Workers KV Storage:Edit, Workers
# Scripts:Edit.
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[placement]
mode = "smart"

# Per-caller write limiting (audit finding, 2026-07-30).
#
# The relay's ADDRESS IS PUBLIC — it is named in the Sync edition's
# Content-Security-Policy, which every visitor can read — so "keep the URL
# private" was never a defence. A mailbox is addressed by an unguessable 128-bit
# sync id, so nobody can read or corrupt anything; but anyone can POST to
# arbitrary ids, and every accepted POST spends one of a small daily quota of KV
# writes. The damage is a household's sync stopping until the quota resets,
# silently, because request logging is off by design.
#
# This binding costs no KV write, which is the point: the control must not
# consume the resource it protects.
#
# 200 writes per minute per IP is far above any real device (an app-open is one
# or two) and far below what makes flooding worthwhile. `period` accepts 10 or 60.
[[unsafe.bindings]]
name = "WRITE_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 200, period = 60 }
