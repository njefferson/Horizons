name: Relay

# The handover point (ADR-0037), deployed when the relay itself changes.
#
# NOT on every push. The relay is a separate deployment from Quietkeep and from
# Quietkeep Sync — the app works with it absent, unreachable, or shut down
# forever — so it has no business redeploying because somebody edited a
# changelog. The path filter is what keeps that true.
#
# `workflow_dispatch` is here too but only becomes usable once this file reaches
# the default branch: GitHub reads the dispatch trigger from there and nowhere
# else, which is why the path filter is doing the work today.
#
# ## What it prints, and why that is the point of running it
#
# The workers.dev URL. That value cannot be derived from anything in this repo:
# it depends on the account's workers.dev subdomain. It has to be READ from a
# real deploy and then written into `src/relay-host.ts`, because a guess produces
# a sync build that passes every gate and silently never reaches anything — the
# exact failure shape this repo keeps finding (V-10).
#
# Actions are SHA-pinned (Doctrine §16.1); these steps run holding a live token.

on:
  push:
    branches: [staging, main]
    paths:
      - 'relay/**'
      - '.github/workflows/relay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay
  cancel-in-progress: false

env:
  WRANGLER_VERSION: "4.114.0"
  KV_TITLE: quietkeep-relay-CHUNKS

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Prepare Cloudflare credentials
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Same handling as deploy.yml, for the same reason: a pasted secret
          # carries a trailing newline that corrupts the Authorization header.
          TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          KEY=$(printf '%s' "$RAW_KEY" | tr -d '[:space:]')
          ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          [ -z "$TOKEN" ] && TOKEN="$KEY"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$ACCOUNT"
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::no Cloudflare credential or account id — set CLOUDFLARE_API_TOKEN (or _API_KEY) and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"

      # BEFORE anything is created, ask whether this credential can do the job,
      # and say exactly what is missing if it cannot.
      #
      # This step exists because the first real run failed with wrangler's
      # "Authentication error [code: 10000]" — which names no permission, no
      # endpoint and no fix, and sits under a step called "create the KV
      # namespace" that had already printed "creating one" as though it were
      # proceeding. The credential deploys Pages perfectly well; it simply has no
      # Workers permissions, and nothing in that message says so.
      - name: Can this credential reach Workers KV?
        run: |
          set -uo pipefail
          CODE=$(curl -s -o /tmp/kv.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces?per_page=1" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "KV namespaces endpoint answered $CODE"
          if [ "$CODE" = "200" ]; then
            echo "This credential can read Workers KV. Proceeding."
            exit 0
          fi
          # Never print the body blind — an error body from Cloudflare is safe,
          # but keep the habit of naming the shape rather than dumping it.
          python3 -c "import json;d=json.load(open('/tmp/kv.json'));print('errors:', d.get('errors'))" || true
          echo "::error::This Cloudflare credential cannot reach Workers KV, so the relay cannot be deployed."
          echo "::error::It CAN deploy Pages — quietkeep.pages.dev works — so the credential is valid and simply too narrow."
          echo ""
          echo "To fix it, in the Cloudflare dashboard:"
          echo "  My Profile -> API Tokens  (or Manage Account -> API Tokens for an account-owned token)"
          echo "  Edit the token used by this repo and ADD these two permissions:"
          echo "    Account -> Workers KV Storage -> Edit"
          echo "    Account -> Workers Scripts    -> Edit"
          echo "Nothing else needs to change, and no secret needs renaming."
          exit 1

      - name: Find or create the KV namespace
        run: |
          set -euo pipefail
          # Idempotent: creating one that exists is an error, and a workflow that
          # can only be run once is a workflow that will be run twice.
          #
          # `|| echo '[]'` on a FAILED list would turn "not allowed to look" into
          # "there are none", and then create a second namespace on every run.
          # The preflight above has already established the credential can read
          # KV, so a failure here is real and is allowed to be fatal.
          LIST=$(npx --yes wrangler@${WRANGLER_VERSION} kv namespace list)
          # One line on purpose: a multi-line here-script inside a YAML block
          # scalar has to stay indented, and an unindented line silently ends the
          # block — which is how the first two runs of this workflow failed
          # before any step executed.
          ID=$(printf '%s' "$LIST" | python3 -c "import json,sys; ns=json.load(sys.stdin); print(next((n['id'] for n in ns if n.get('title','').endswith('$KV_TITLE')), ''))" 2>/dev/null || true)
          if [ -z "$ID" ]; then
            echo "No namespace titled $KV_TITLE — creating one."
            OUT=$(npx --yes wrangler@${WRANGLER_VERSION} kv namespace create "$KV_TITLE")
            echo "$OUT"
            # wrangler prints the id in the binding snippet it suggests.
            ID=$(printf '%s' "$OUT" | grep -oE '[0-9a-f]{32}' | head -1)
          fi
          if [ -z "$ID" ]; then
            echo "::error::could not find or create the KV namespace. The credential may lack Workers KV Storage:Edit."
            exit 1
          fi
          echo "::add-mask::$ID"
          echo "KV_ID=$ID" >> "$GITHUB_ENV"
          echo "KV namespace ready."

      - name: Point wrangler.toml at it
        run: |
          set -euo pipefail
          # The id is account-specific and is injected rather than committed, so
          # the repo carries no account details.
          sed -i "s|REPLACE_WITH_KV_NAMESPACE_ID|${KV_ID}|" relay/wrangler.toml
          grep -q REPLACE_WITH relay/wrangler.toml && { echo "::error::the placeholder was not replaced"; exit 1; } || true

      - name: Deploy the relay
        id: deploy
        working-directory: relay
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} deploy 2>&1 | tee out.txt

          # THE LIMITER MUST ACTUALLY BE BOUND (V-19).
          #
          # It is declared under `[[unsafe.bindings]]`, which wrangler itself
          # warns is experimental and "may change or break at any time" — and it
          # is the only control bounding a stranger's ability to spend the daily
          # KV write quota. If a future wrangler REJECTS the stanza the deploy
          # goes red, which is safe. If it silently IGNORES it, the deploy goes
          # green, `allowWrite` is undefined, and the relay fails open with
          # nothing red anywhere. That second case is the one worth a gate.
          #
          # wrangler prints the binding table it actually applied, so this asks
          # the deploy what it did rather than trusting what was asked for.
          if ! grep -q 'WRITE_LIMIT' out.txt; then
            echo "::error::the deploy did not bind WRITE_LIMIT — the relay would accept unlimited writes from anyone. See V-19."
            exit 1
          fi
          echo "WRITE_LIMIT is bound."

          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' out.txt | head -1)
          if [ -z "$URL" ]; then
            echo "::error::the deploy did not print a workers.dev URL. If workers.dev is disabled on this account, the relay needs a custom domain instead."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Check it actually answers
        run: |
          set -uo pipefail
          URL="${{ steps.deploy.outputs.url }}"
          # A deploy that succeeded and a relay that works are different claims,
          # and only the second one is worth anything. An unknown id must answer
          # with an empty chunk list, not a 404 and not a 500.
          #
          # WITH RETRIES, because a freshly published workers.dev route is not
          # servable the instant wrangler prints its URL — the first run of this
          # step failed on a 404 issued 0.1s after the deploy, which said nothing
          # about the worker and everything about the timing of the question.
          BODY=""
          for attempt in 1 2 3 4 5 6 7 8; do
            CODE=$(curl -s -o /tmp/relay.txt -w '%{http_code}' "$URL/v1/00000000000000000000000000000000" || echo 000)
            BODY=$(cat /tmp/relay.txt 2>/dev/null || true)
            echo "attempt $attempt: HTTP $CODE  $BODY"
            [ "$CODE" = "200" ] && break
            sleep 10
          done
          if [ "$CODE" != "200" ]; then
            echo "::error::the relay did not answer with 200 after 8 tries (last: $CODE). It is deployed at $URL but not serving."
            exit 1
          fi
          printf '%s' "$BODY" | grep -q '"chunks"' || { echo "::error::the relay answered 200, but not like a relay: $BODY"; exit 1; }

          # The preflight matters as much as the GET: the app is on another
          # origin, so every POST is preceded by an OPTIONS, and a relay that
          # 500s there is one that works in a test and never in a browser.
          PRE=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "$URL/v1/00000000000000000000000000000000")
          echo "OPTIONS preflight: $PRE"
          case "$PRE" in 204|200) ;; *) echo "::error::the preflight answered $PRE — a browser could not POST to this"; exit 1;; esac

          # The status page a person can open, and the DELETE route revocation
          # needs. Both are new, and a deploy that shipped them broken would be a
          # green deploy of a broken feature — the exact V-10 shape.
          STAT=$(curl -s "$URL/status")
          echo "status page: $(printf '%s' "$STAT" | head -1)"
          printf '%s' "$STAT" | grep -qi 'Quietkeep relay' || { echo "::error::/status did not return the health page"; exit 1; }

          # DELETE must empty a mailbox. Drop a shaped seal in, delete, confirm gone.
          SEAL='{"v":1,"iv":"AAAAAAAAAAAAAAAA","ct":"AAAAAAAAAAAAAAAAAAAAAA=="}'
          curl -s -X POST "$URL/v1/11111111111111111111111111111111" -H 'content-type: application/json' --data "$SEAL" >/dev/null
          DEL=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE "$URL/v1/11111111111111111111111111111111")
          echo "DELETE: $DEL"
          [ "$DEL" = "200" ] || { echo "::error::DELETE (revocation) did not answer 200"; exit 1; }
          AFTER=$(curl -s "$URL/v1/11111111111111111111111111111111")
          printf '%s' "$AFTER" | grep -q '"chunks":\[\]' || { echo "::error::DELETE did not actually empty the mailbox: $AFTER"; exit 1; }

          echo "The relay is up, answering, revocable, and reachable from another origin."

      - name: What to do with this
        run: |
          echo ""
          echo "  RELAY URL: ${{ steps.deploy.outputs.url }}"
          echo ""
          echo "Put that value in src/relay-host.ts as RELAY_HOST, commit it, and the"
          echo "sync edition will build. tools/editions.mjs generates the sync build's"
          echo "CSP from it, so the host the app dials and the host the browser permits"
          echo "stay the same by construction."
