name: Deploy

# staging -> staging.quietkeep.pages.dev   (Noah's on-device pass; Doctrine §7)
# main    -> quietkeep.pages.dev           (production, only after his "promote")
#
# Cloudflare Pages serves a preview branch at <branch>.<project>.pages.dev, which
# is what turns the §7 staging gate from a convention I observe into a URL he can
# open on the iPad.
#
# HONESTY NOTE (Doctrine §5): the deploy STEPS below have never run green, because
# there is nothing to deploy yet — this repo has no public/ and no app shell. The
# guard immediately below makes that state explicit and skips instead of
# publishing an empty directory over a live site. Until a run reaches the wrangler
# step and succeeds, this file is a prepared path and NOT a proven deploy.
#
# Actions are pinned by SHA, not tag (Doctrine §16.1) — a tag is a mutable pointer
# someone else controls, and these steps execute holding a live Pages:Edit token.
# Modelled on the hub's deploy.yml, which is the tested article.

on:
  push:
    branches: [staging, main]
  workflow_dispatch:

# Latest-wins is right for a preview and WRONG for production.
#
# On `main` a superseded deploy means the previous release is quietly still being
# served while nothing anywhere is red: a cancelled run's conclusion is
# `cancelled`, not `failure`, so it reads as neutral to every glance and every
# notification. That is the perfect place for a staleness bug to live. It has
# already happened once in a sibling app — a promote's deploy killed twenty
# seconds later by a record-keeping commit — and it was harmless only because the
# second push carried the same `public/` tree. That is luck, and luck is not a
# deploy strategy.
#
# On `staging` superseding is exactly what is wanted: the newest preview is the
# only one anybody cares about.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

env:
  PROJECT: quietkeep
  # Pinned so a wrangler release cannot change deploy behaviour without a commit
  # (Doctrine §16.1, and LESSONS §8 — a wrong pin is worse than none, so this one
  # is recorded with its reason: it is the version the hub deploys with today).
  WRANGLER_VERSION: "4.114.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      # public/app.js is generated and deliberately not committed (ADR-0026), so
      # the deploy builds it. Without this the shell would ship with no app.
      - run: npm ci
      - run: npm run build

      - name: Is there anything to deploy yet?
        id: site
        run: |
          # Phase 0 is the spine — src/, test/, no UI. Publishing an empty
          # directory to Pages would replace a live site with nothing, so the
          # absence of a shell is a SKIP, never a deploy.
          if [ -f public/index.html ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "public/index.html found — proceeding."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No public/index.html — there is no app shell in this repo yet."
            echo "Skipping the deploy rather than publishing an empty directory."
            echo "This is the expected state until Phase 1 lands."
          fi

      - name: Prepare Cloudflare credentials
        id: cf
        if: steps.site.outputs.present == 'true'
        env:
          # Either name is accepted. The credential is stored as
          # CLOUDFLARE_API_KEY in this repo; CLOUDFLARE_API_TOKEN is the name the
          # hub uses. Reading both means the deploy does not break on which word
          # someone reached for, and nobody has to rename a working secret.
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          RAW_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Strip any whitespace/newlines that sneak in when a secret is pasted.
          # A trailing newline corrupts the Authorization header (Cloudflare 6111).
          TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          KEY=$(printf '%s' "$RAW_KEY" | tr -d '[:space:]')
          EMAIL=$(printf '%s' "$RAW_EMAIL" | tr -d '[:space:]')
          ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')

          # Which NAME was found is safe to log and saves the next hour of
          # guessing. The value never is.
          if [ -n "$TOKEN" ]; then
            echo "credential: CLOUDFLARE_API_TOKEN"
          elif [ -n "$KEY" ]; then
            echo "credential: CLOUDFLARE_API_KEY"
            TOKEN="$KEY"
          fi

          echo "::add-mask::$TOKEN"
          echo "::add-mask::$ACCOUNT"
          [ -n "$EMAIL" ] && echo "::add-mask::$EMAIL"
          echo "CF_EMAIL=$EMAIL" >> "$GITHUB_ENV"
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            # HARD FAIL, not a skip. Skipping is the right answer when there is
            # no site to publish — that is the guard above. Once public/index.html
            # exists, "I could not publish it" is a broken deploy, and a green run
            # that shipped nothing is the exact failure this repo keeps finding
            # (V-10). Say which secret is missing; never name its value.
            echo "::error::public/index.html exists but the deploy cannot run."
            [ -z "$TOKEN" ]   && echo "::error::no credential found — set CLOUDFLARE_API_TOKEN or CLOUDFLARE_API_KEY."
            [ -z "$ACCOUNT" ] && echo "::error::CLOUDFLARE_ACCOUNT_ID is empty or unset."
            echo "Set them at Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi
          # Doctrine §16.4: the cleaned values go to the job environment, never to
          # step outputs. Outputs persist in the run's stored output and are
          # readable through the API; env is scoped to this job's steps. Only the
          # non-secret `ready` flag is an output.
          echo "CF_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CF_ACCOUNT=$ACCOUNT" >> "$GITHUB_ENV"

      # Informative, never a gate. A scoped API token verifies here; a Global API
      # Key does NOT — it authenticates with X-Auth-Key + X-Auth-Email instead,
      # so a "valid: False" below is a clue about WHICH kind of credential this
      # is, not proof it is broken. The deploy step is the real arbiter.
      - name: What kind of credential is this?
        if: steps.cf.outputs.ready == 'true'
        continue-on-error: true
        run: |
          echo "credential length: ${#CF_TOKEN}"
          curl -s https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer $CF_TOKEN" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('scoped token valid:', d.get('success'), '| status:', (d.get('result') or {}).get('status'), '| errors:', d.get('errors'))"
          if [ -n "$CF_EMAIL" ]; then
            curl -s https://api.cloudflare.com/client/v4/user \
              -H "X-Auth-Key: $CF_TOKEN" -H "X-Auth-Email: $CF_EMAIL" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print('global key valid:', d.get('success'), '| errors:', d.get('errors'))"
          else
            echo "no CLOUDFLARE_EMAIL set — if the credential is a Global API Key rather than a scoped token, wrangler needs that too."
          fi

      - name: Ensure Pages project exists
        if: steps.cf.outputs.ready == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ env.CF_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages project create ${{ env.PROJECT }} --production-branch=main

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ env.CF_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy public --project-name=${{ env.PROJECT }} --branch=${{ github.ref_name }} --commit-dirty=true

      # --- Quietkeep Sync (ADR-0036), when there is one to ship ----------------
      #
      # `build:sync` writes dist/sync ONLY when src/relay-host.ts names a real
      # relay. With no relay deployed it skips, loudly, and exits zero — so this
      # whole tail is inert rather than red. "There is no sync edition yet" is an
      # honest state; a permanently failing deploy step is not, and would train
      # everybody to ignore a red Deploy.
      - name: Build the Sync edition, if there is a relay
        if: steps.site.outputs.present == 'true'
        run: npm run build:sync

      - name: Is there a Sync edition to deploy?
        id: sync
        if: steps.site.outputs.present == 'true'
        run: |
          if [ -f dist/sync/index.html ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "dist/sync built — Quietkeep Sync will be published."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No dist/sync. There is no relay host set, so there is no Sync edition."
            echo "This is expected until the relay is deployed — see V-18."
          fi

      - name: Ensure the Sync Pages project exists
        if: steps.cf.outputs.ready == 'true' && steps.sync.outputs.present == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ env.CF_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages project create ${{ env.PROJECT }}-sync --production-branch=main

      - name: Deploy Quietkeep Sync
        if: steps.cf.outputs.ready == 'true' && steps.sync.outputs.present == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ env.CF_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy dist/sync --project-name=${{ env.PROJECT }}-sync --branch=${{ github.ref_name }} --commit-dirty=true

      - name: Where this went, and how to roll it back
        if: always() && steps.cf.outputs.ready == 'true'
        run: |
          # Doctrine §16 — the rollback path is printed on every deploy so it is
          # known BEFORE it is needed, not looked up during an outage.
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "Deployed to PRODUCTION: https://quietkeep.pages.dev"
          else
            echo "Deployed to preview: https://${{ github.ref_name }}.quietkeep.pages.dev"
          fi
          echo ""
          echo "If this deploy is bad:"
          echo "  Cloudflare dashboard -> Workers & Pages -> quietkeep -> Deployments"
          echo "  -> pick the last good one -> Manage deployment -> Rollback."
          echo "That is instant. A git revert is also fine but waits for a fresh build,"
          echo "On staging a newer push supersedes this deploy; on main it does not."
