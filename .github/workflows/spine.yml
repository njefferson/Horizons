name: Spine

# Phase 0 exit criteria run on every change. Doctrine §16.8: make it a gate, not
# an intention. Actions are SHA-pinned (§16.1).

on:
  push:
    branches: [staging, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: npm ci

      # FIRST, because a workflow that does not parse fails in under a second
      # with zero jobs — reported as red with nothing readable in it. Cheapest
      # possible check for the least legible possible failure.
      - name: Workflow files parse
        run: npm run workflows:check

      # Doctrine §9b — the FAIL state: nothing personal about the owner lands
      # in this repo. The canonical patterns live in the hub and are widened
      # there, so this step checks the hub out fresh and runs THAT copy —
      # test/privacy.test.ts mirrors the patterns for offline `npm test`, but
      # this is the gate that cannot lag. The path is untracked, so the scan
      # (`git ls-files`) never reads the hub's own files as this repo's.
      - name: Check out the hub's canonical gates
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: njefferson/noahjefferson
          path: .hub-gates
          persist-credentials: false
      - name: The owner's person is not repo material (Doctrine 9b)
        run: node .hub-gates/privacy-check.mjs --repo .

      # test/privacy.test.ts mirrors the hub's patterns so `npm test` fails
      # offline. A mirror that drifts is not a smaller gate, it is a different
      # one — a stale over-broad copy already blocked four consecutive deploys
      # in a sibling repo (LESSONS §53).
      - name: The offline pattern mirror has not drifted from the hub
        run: node .hub-gates/privacy-mirror-check.mjs --repo .

      - run: npm run typecheck
      - run: npm run test:only

      # The brand assets carry measured contrast ratios (ACCESSIBILITY.md B-10).
      # Checking them here means a change to icon.svg or the social preview cannot
      # quietly drop below 3:1 — B-08's rule is that a new pair joins the gate in
      # the same commit that introduces it, and this is that gate.
      - name: Install chromium for the browser checks
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Brand assets
        run: npm run brand:check

      # Doctrine §7: the changelog's head triplet and the service-worker cache
      # name bump together. A rule someone has to remember, until it is a check.
      - name: Changelog and triplet
        run: npm run changelog:check

      # The hosted "why it works this way" page is GENERATED from the rationale
      # doc (tools/thesis.mjs), so the two cannot drift — same rule as the
      # changelog, so it earns the same gate.
      - name: Thesis page in sync with the doc
        run: npm run thesis:check

      # The unit tests prove the spine folds. They cannot prove the bundle
      # loads, that Dexie opens in a browser, or that a captured thought comes
      # back — which is the app's one promise. Only driving the built page does
      # that, so the build and the walk are both gates (build-plan §4).
      - run: npm run build
      - name: Headless walk of the built app
        run: npm run smoke

      # Doctrine §7h asks for a REAL second worker rather than a mocked
      # registration, because a mock proves the mock works. This serves a
      # genuinely different sw.js and lets Chromium's own update machinery run.
      # It found a live §7h.3 defect on its first run that the source-reading
      # unit tests could not see.
      - name: A real second worker waits for the reader
        run: npm run update:walk

      # The rendered app, audited: contrast computed per state in both themes,
      # axe per state, targets, and B-04's hardest viewport (320px at 200%
      # text). This is B-08's claimed gate actually existing for the app, not
      # only for the brand tokens. Its first run caught a real defect (F-01).
      - name: Rendered accessibility
        run: npm run a11y

      # ADR-0036: the default build's guarantee is that the BROWSER refuses to
      # let it reach another host. That is one line of _headers, so it is gated —
      # it is exactly the kind of thing that erodes quietly.
      - name: Network posture
        run: npm run headers:check

      # ADR-0036's OTHER half. `headers:check` proves the default origin cannot
      # reach anywhere; this proves the sync module is not in the default bundle
      # at all — read out of the built artefact, and with the marker list itself
      # checked against a sync build so the gate cannot pass by testing for words
      # nothing emits.
      - name: Two editions
        run: npm run build:sync

      # The vocabulary is a closed list and "overdue"/"streak" are banned
      # outright (ADR-0010). A grep is the cheapest possible gate.
      # ONE definition, in package.json, so `npm run vocabulary` locally is the
      # same check CI runs. It was written out longhand here and approximated by
      # hand at the terminal — which is how 0.15.0 and 0.16.0 passed nine gates
      # locally and went red in CI on the tenth. Two copies of one rule drift.
      - name: No banned vocabulary
        run: npm run vocabulary

      # The closed list, checked against the DOCUMENT that governs it (1.9.1).
      # `isKnownKind` has always refused an unlisted kind at runtime, and
      # nothing ever asked whether the code's list and
      # docs/event-vocabulary.md still name the same events — so the file
      # CLAUDE.md calls the source of truth could drift from the code in
      # silence. It also checks the Silent? column, which the vocabulary
      # itself calls "the machine-checkable form of product law 1" and which
      # nothing had ever machine-checked.
      - name: The closed event list matches the vocabulary
        run: npm run events:check

      # "Nothing outside the gate imports the store's write API" — claimed in
      # the build plan since it was written, checked by nothing, while four
      # legitimate raw-write sites accumulated (1.9.1). Raw writes are not
      # forbidden; unrecorded ones are. The allowlist carries a reason per
      # entry, and a stale entry fails too.
      - name: No unrecorded write-gate bypass
        run: npm run writegate:check

      # Twice in one day the same shape landed: `export.written` recorded since
      # Phase 0 and read by nothing, so no surface could say when a copy last
      # left (ADR-0062); `snapshot.written` declared in Phase 0 and written by
      # nothing, so every cold start replayed the whole log (ADR-0063). Both
      # were invisible — a noun nothing writes breaks nothing, it just means a
      # feature the record insists exists does not. Every kind is now either
      # written by the app or says in the vocabulary, in words, that it is not
      # and why. A stale note fails too.
      - name: Every noun accounts for itself
        run: npm run emitters:check

      # And every kind is DEMONSTRATED, or says why not (1.16.0, ADR-0067). The
      # sample set was written at 0.22.0 and sixteen releases later contained 8
      # of the 70 kinds the app emits — so every surface built after it had
      # never once been seen with data in it. This generates the set for real,
      # runs it through the write boundary, and asks what came out.
      - name: The sample set covers the app
        run: npm run sample:check

      # Storage is IndexedDB via Dexie and localStorage is banned outright. That
      # ban rested on review alone until a security audit pointed out it was the
      # only invariant in CLAUDE.md with no gate behind it — unlike connect-src
      # and the vocabulary, both of which fail the build. A rule enforced by
      # remembering is a rule that lapses on a busy afternoon.
      - name: No localStorage
        run: npm run storage:check
